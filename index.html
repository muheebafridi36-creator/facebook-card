<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="left">
            <h1>facebook</h1>
            <p>
                Connect with friends and the world<br>
                around you on Facebook.
            </p>
        </div>

        <div class="login-card">

            <form onsubmit="return false;">
            <input 
            type="text" 
             placeholder="Email or phone number">

        <input 
                    type="password" 
                    placeholder="Password">

    <button class="login-btn" type="button">
                    Login
    </button>

                <a href="#" class="forgot">
    Forgot password?</a>

    <hr>

        <button class="create-btn" type="button">
         Create new account
         </button>
    </form>

        </div>

    </div>

</body>
</html>
